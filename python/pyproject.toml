[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[project]
name = "pleaxy"
version = "0.1.0"
description = "Official Python client for the Pleaxy API: purchase orders, invoices and settlement for cloud spend."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.23.0,<1",
  "attrs>=22.2.0",
  "python-dateutil>=2.8.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://pleaxy.ai/sdks"
Source = "https://github.com/pleaxyai/pleaxy-sdk/tree/main/python"

[tool.hatch.build.targets.wheel]
packages = ["src/pleaxy"]

[tool.mypy]
files = ["src/pleaxy/__init__.py", "src/pleaxy/_transport.py", "src/pleaxy/_resources.py", "examples", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
